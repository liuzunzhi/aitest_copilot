[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
version_path_separator = os
# The DSN is read from application config in migrations/env.py; keep this empty.
# NOTE: this file must stay ASCII-only. Alembic reads it with the locale
# encoding (GBK on zh-CN Windows), so non-ASCII comments break startup.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
