[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitest-copilot"
version = "0.1.0"
description = "AI 辅助测试平台后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-cov>=6.0",
    "pytest-playwright>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not e2e'"
markers = [
    "e2e: 需要前后端已启动的 Playwright 前台用例（pytest -m e2e 单独执行）",
    "task: 前台用例归属的任务号，决定截图目录",
]
